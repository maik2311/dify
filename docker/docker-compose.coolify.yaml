  ssrf_proxy_network:
    driver: bridge
    internal: true
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
  agent_sandbox_network:
    driver: bridge
    internal: true
volumes:
  dify_agent_local_sandbox_home: null
  dify_agent_local_sandbox_workspace: maik